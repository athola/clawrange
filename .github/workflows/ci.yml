name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so gitleaks can scan every commit in the push/PR.
          fetch-depth: 0

      # The whole repo, not just scripts/: openclaw/sync-heartbeat.sh and
      # workflows/entrypoint.sh run in the containers.
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: "."
          severity: warning

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate YAML
        run: |
          pip install --quiet yamllint==1.38.0
          yamllint -d relaxed docker-compose.yml docker-compose.prod.yml deerflow/config.yaml

      - name: Validate JSON
        run: |
          for f in openclaw/config/openclaw.json; do
            python3 -m json.tool "$f" > /dev/null && echo "OK: $f" || { echo "FAIL: $f"; exit 1; }
          done

      - name: Validate Docker Compose
        run: |
          docker compose -f docker-compose.yml config --quiet
          # The prod override requires TAILSCALE_IP; any address will do here.
          TAILSCALE_IP=100.64.0.1 docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Scan for secrets
        run: |
          FOUND=0
          for pattern in 'sk-or-v1-[a-zA-Z0-9]' 'AKIA[0-9A-Z]' 'ghp_[a-zA-Z0-9]'; do
            if grep -rn "$pattern" --include='*.yml' --include='*.yaml' --include='*.json' --include='*.sh' --include='*.py' . 2>/dev/null | grep -v '.env.example' | grep -v '.git/'; then
              echo "FAIL: Possible secret matching pattern '$pattern'"
              FOUND=1
            fi
          done
          if [ "$FOUND" = "1" ]; then exit 1; fi
          echo "OK: No secrets detected"

  python-tests:
    name: Python lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # uv installs the Python and the exact tool and runtime versions from
      # uv.lock, so CI runs what pre-push and the Docker image run.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      # Same hook as the local commit gate: rendered personas and local-*
      # profiles hold operator identity and must never be committed.
      - name: Operator-private files not committed
        run: uvx --from pre-commit==4.4.0 pre-commit run forbid-operator-private --all-files

      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt -o workflows/requirements.txt -q
          git diff --exit-code workflows/requirements.txt

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy workflows scripts tests

      - name: Run validation suite
        run: uv run python tests/validate_stack.py

      - name: Run test suite
        run: uv run pytest -q -rf -n auto
