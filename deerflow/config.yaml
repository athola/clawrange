# DeerFlow Configuration — AI MSP Testbed
# Schema of the DeerFlow ref pinned in scripts/start.sh (DEERFLOW_REF).
#
# DATA SOVEREIGNTY: All LLM calls route through OpenRouter (https://openrouter.ai).
# This ensures client data NEVER touches ByteDance/Doubao/Volcengine infrastructure.
# OpenRouter acts as a proxy — we choose which downstream model handles the request,
# and OpenRouter's privacy policy governs data handling (no training on API data).
# This is a hard requirement for MSP clients in regulated industries.

config_version: 63

log_level: info

# Token usage tracking is a local middleware (no reporting off-host); keep
# it off for the testbed. DeerFlow is MIT-licensed OSS: we control the flow.
token_usage:
  enabled: false

models:
  # Researcher: cost-effective model for gathering and synthesizing information
  - name: researcher
    display_name: DeepSeek Chat (OpenRouter)
    use: langchain_openai:ChatOpenAI
    model: deepseek/deepseek-chat
    api_key: $OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    max_tokens: 4096
    temperature: 0.3

  # Writer: drafts reports and summaries from research findings
  - name: writer
    display_name: Claude Haiku 5.5 (OpenRouter)
    use: langchain_openai:ChatOpenAI
    model: anthropic/claude-haiku-5.5
    api_key: $OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    max_tokens: 4096
    temperature: 0.5

  # Reviewer: evaluates and refines the writer's output
  - name: reviewer
    display_name: Claude Haiku 5.5 (OpenRouter)
    use: langchain_openai:ChatOpenAI
    model: anthropic/claude-haiku-5.5
    api_key: $OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    max_tokens: 2048
    temperature: 0.2

# Keyless tools only (no image search: not needed for MSP research).
# 5 results per search keeps test runs fast.
tool_groups:
  - name: web

tools:
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10

# Output directory for generated reports
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false

# Summarization settings
summarization:
  enabled: true
  trigger:
    - type: tokens
      value: 8000
  keep:
    type: fraction
    value: 0.5

# No external channel integrations for testbed
channels: {}
